# /etc/kernel/install.conf
#
# Declarative boot layout. Read by kernel-install(8), which is the single entry
# point that drives dracut -> ukify -> 90-uki-copy.install.
#
# layout=uki means kernel-install produces one PE binary containing kernel,
# initramfs and command line, and places it on the ESP under /EFI/Linux/.
# There is no loader entry and no bootloader, because there is no bootloader.

layout=uki
initrd_generator=dracut
uki_generator=ukify
