# dracut configuration for the LIVE (ISO) initramfs
# =================================================
#
# Installed as /etc/dracut.conf.d/00-live.conf in the live rootfs only.
#
# The live initramfs has one job: find the squashfs on the CD, mount it, and
# overlay a writable tmpfs on top. It is deliberately NOT host-only — it is
# built in a container on ubuntu-uki-iso and has to boot on whatever machine the
# ISO is inserted into.

# Not host-only. hostonly=yes would bake in the build container's device
# topology, which is not the topology the ISO boots on.
hostonly="no"

# dmsquash-live is the module that implements root=live:... and the rd.live.*
# options. overlayfs provides the writable layer (see rd.live.overlay.overlayfs
# in config/cmdline/live). mdraid is included so the installer can assemble the
# array — the live cmdline passes rd.md=0 to stop dracut assembling it
# automatically, so the module is present but idle until the installer asks.
add_dracutmodules+=" dmsquash-live overlayfs mdraid "

# The GPU is excluded from every initramfs, live included. Nouveau is a large
# module plus a large firmware set, and nothing in early boot needs it: the
# installed system loads it from the rootfs once / is up. Leaving it out keeps
# the initramfs small and keeps the live environment from touching the GPU at
# all.
omit_drivers+=" nouveau "

# dracut would otherwise pull in every firmware file it can find on the build
# host. The live environment needs essentially none.
omit_dracutmodules+=" ecryptfs "

# zstd throughout — faster to decompress than xz at a size cost that does not
# matter on a USB stick.
compress="zstd"
