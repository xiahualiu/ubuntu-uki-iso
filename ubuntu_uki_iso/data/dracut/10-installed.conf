# dracut configuration for the INSTALLED system's initramfs
# =========================================================
#
# Installed as /etc/dracut.conf.d/10-installed.conf in the installed rootfs.
#
# This one IS host-only, and that is the point: kernel-install runs inside the
# freshly-copied rootfs on the target machine (installer/40-uki.sh chroots in),
# so dracut can see the real hardware and include exactly the drivers this box
# needs to reach its root filesystem. Same kernel, smaller initramfs, no
# guessing.

hostonly="yes"

# mdraid is what assembles the data array at boot. The installed cmdline does
# not pass rd.md=0 (only the live one does), so the array is assembled by the
# initramfs before the installer's concerns are even relevant — on the
# installed system this is an ordinary boot-time requirement.
add_dracutmodules+=" mdraid "

# GPU stays out of here too. nouveau is loaded from the rootfs after the switch
# to the real root; the initramfs only needs enough DRM to hand over the EFI
# framebuffer, and simpledrm (built in, not a module) already does that.
omit_drivers+=" nouveau "

compress="zstd"
