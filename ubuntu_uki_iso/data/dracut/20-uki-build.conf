# dracut configuration for building the TARGET's UKI on the build machine
# ======================================================================
#
# Read with --conf by `ubuntu-uki-iso build uki-target`. Deliberately NOT
# installed into any rootfs: it describes a build that happens here, not a
# system that boots anywhere.
#
# Both of the things it has to get right are "do not look at this machine".
#
# hostonly="no" is mandatory, not a preference. This runs in a container or on
# a CI runner that is not the target machine and has no block devices at all,
# so a host-only probe would produce an initramfs with no storage drivers in
# it — a machine that cannot find its own root filesystem.
#
# The driver list is a whitelist, not a default set. dracut's non-hostonly
# default includes every storage and network driver it can find; the target
# needs three modules, and naming them is both smaller and reproducible. It is
# also a claim that has to stay true: if the machine's storage changes, this
# list changes with it. It is derived from the Target hardware table in the
# README, and out/kernel/base.config is what says which of those drivers are
# modules rather than built in.

hostonly="no"

# BLK_DEV_NVME, SATA_AHCI and MD_RAID0 are =m, so they must be in the
# initramfs: the root disk, the eight data disks, and assembling the array.
# libata arrives as a dependency of ahci. Everything else the target needs to
# mount its root is built into the kernel — ATA, BLK_DEV_SD, MD and EXT4_FS are
# all =y — so nothing else is listed, and OVERLAY_FS and USB_STORAGE are
# deliberately absent because they belong to the live image, not this one.
drivers+=" nvme ahci raid0 "

# What 10-installed.conf asks for, so the prebuilt initramfs matches what the
# target would have built for itself: the array is assembled at boot, before
# the root filesystem's fstab is even relevant.
add_dracutmodules+=" mdraid "

# The GPU is excluded from every initramfs in this project. On the target it is
# loaded from the root filesystem after the switch to the real root.
omit_drivers+=" nouveau "

compress="zstd"
