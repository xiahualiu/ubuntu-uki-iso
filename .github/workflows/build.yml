name: build

# The runner is NOT the target machine. It never has been the machine this
# image is installed onto, and nothing here may assume it is: the build is
# hardware-independent by construction, because the driver trim is *declared*
# (ubuntu_uki_iso/kernel/config.py) rather than observed, and the target's
# initramfs is built from an explicit module list rather than from a probe.
#
# That is also why the runner does not need to be trusted with the array. The
# build jobs run inside the container built from build/Dockerfile, which is
# given only SYS_ADMIN and the workspace — never /dev, never --privileged, and
# the machine that owns /dev/sd{a..h} is somewhere else.
#
# The `image` job publishes that container to GHCR; every other job that needs
# it pulls it by the commit SHA (never :latest, so a run always builds in the
# image built from its own commit). `lint` stays on a GitHub-hosted runner.
#
#   - The jobs below are gated so that untrusted events cannot reach the
#     self-hosted runner. pull_request runs lint only, and it runs on a
#     GitHub-hosted runner.

on:
  push:
    branches: [main]
    paths:
      - 'ubuntu_uki_iso/**'
      - 'tests/**'
      - 'build/**'
      - '.dockerignore'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      run_vm_tests:
        description: 'Run the QEMU tests after building the ISO'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

env:
  # Keeps the squashfs and ISO timestamps deterministic where the tools allow.
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  # ---------------------------------------------------------------------------
  # image — build build/Dockerfile and publish both stages to GHCR. This is the
  # one job that runs on the host rather than in a container: it needs docker,
  # and it is where the workspace is reclaimed from the previous run's
  # root-owned output (container jobs run as root, and their writes land on the
  # bind-mounted workspace as root).
  # ---------------------------------------------------------------------------
  image:
    name: publish the container image
    runs-on: [self-hosted, linux, x64]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      # The next checkout runs as the runner user and would fail its `git
      # clean` on root-owned files left under out/. The mkdir matters: `docker
      # run -v` on a missing host path creates it root-owned.
      - name: reclaim workspace ownership
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          docker run --rm -v "$GITHUB_WORKSPACE:/w" ubuntu:26.04 \
            chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build the build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          target: build
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/build:latest
            ghcr.io/${{ github.repository }}/build:${{ github.sha }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max
      - name: build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          target: test
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/test:latest
            ghcr.io/${{ github.repository }}/test:${{ github.sha }}
          cache-from: |
            type=gha,scope=test
            type=gha,scope=build
          cache-to: type=gha,scope=test,mode=max

  # ---------------------------------------------------------------------------
  # lint — runs anywhere, on every event including forks.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install -e '.[dev]'
      - name: lint
        run: |
          ruff check ubuntu_uki_iso tests
          ruff format --check ubuntu_uki_iso tests
      - name: workflow syntax
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/build.yml'))"
      # The RAID decision table. Runs anywhere, needs no root and no disks —
      # every device helper is stubbed, so it cannot reach a real device even
      # when the logic under test is wrong.
      - name: RAID decision table
        run: ubuntu-uki-iso test unit

  # ---------------------------------------------------------------------------
  # kernel — expensive, so it runs only when asked or when tagging.
  # ---------------------------------------------------------------------------
  kernel:
    name: build kernel
    runs-on: [self-hosted, linux, x64]
    needs: [image]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/build:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --cap-add SYS_ADMIN
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      # The kernel build dominates the wall clock. Caching it keyed on the trim
      # fragment means a change to a shell script or the ISO layout does not
      # cost another 45 minutes.
      - name: restore kernel artifacts
        uses: actions/cache@v4
        with:
          path: out/kernel
          key: kernel-${{ hashFiles('ubuntu_uki_iso/kernel/config.py') }}

      - name: build
        run: |
          python3 -m ubuntu_uki_iso.cli build kernel

      - name: record the release
        id: release
        run: echo "release=$(cat out/kernel/release)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.release.outputs.release }}
          path: |
            out/kernel/*.deb
            out/kernel/release
            out/kernel/config.diff
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iso — the deliverable.
  # ---------------------------------------------------------------------------
  iso:
    name: build iso
    runs-on: [self-hosted, linux, x64]
    needs: [image]
    if: github.event_name != 'pull_request'
    permissions:
      # action-gh-release writes the release; packages: read pulls the image.
      contents: write
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/build:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --cap-add SYS_ADMIN
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: restore kernel artifacts
        uses: actions/cache@v4
        with:
          path: out/kernel
          key: kernel-${{ hashFiles('ubuntu_uki_iso/kernel/config.py') }}

      # `build iso` needs a kernel; if the cache missed, build one.
      - name: kernel (cache miss)
        run: test -s out/kernel/release && echo "kernel present" || python3 -m ubuntu_uki_iso.cli build kernel

      # Every stage the ISO needs is built here, explicitly. It used to run
      # `build iso` alone, which requires the rootfs images, both UKIs and the
      # squashfs to already exist and never builds any of them — it worked only
      # while a previous run's out/ happened to still be on the runner.
      #
      # Not `build all`: that would rebuild the 45-minute kernel every time,
      # cache or no cache.
      - name: restore the image stages
        uses: actions/cache@v4
        with:
          path: |
            out/rootfs-live
            out/rootfs-installed
            out/uki
            out/iso
          key: >-
            images-${{ hashFiles('ubuntu_uki_iso/**', 'pyproject.toml') }}-${{
              hashFiles('ubuntu_uki_iso/kernel/config.py') }}

      - name: build the rootfs images
        run: |
          test -s out/iso/live/filesystem.squashfs && test -s out/iso/payload/rootfs.squashfs \
            && echo "rootfs and SquashFS present" || python3 -m ubuntu_uki_iso.cli build rootfs all

      - name: build the UKIs
        run: test -s out/uki/BOOTX64.EFI && echo "live UKI present" || python3 -m ubuntu_uki_iso.cli build uki

      - name: build the installed UKI
        run: python3 -m ubuntu_uki_iso.uki.build --temp-dir out --mode installed

      - name: build the ISO
        run: python3 -m ubuntu_uki_iso.cli build iso

      - name: verify the boot chain
        run: |
          set -euo pipefail
          # The volume label and the live cmdline must agree or the ISO boots
          # to a rescue shell. build/iso.py checks this too; this is the CI copy
          # of the assertion, so a regression cannot pass silently.
          label=$(xorriso -indev out/ubuntu_uki_iso.iso -pvd_info 2>/dev/null \
                  | sed -n 's/^Volume id *: *//p' | head -1)
          echo "volume id: $label"
          test "$label" = "UBUNTU-UKI-ISO"

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-uki-iso
          path: out/ubuntu_uki_iso.iso
          if-no-files-found: error

      - name: release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # Publish kernel inputs and both EFI artifacts alongside the LiveUSB ISO.
          files: |
            out/ubuntu_uki_iso.iso
            out/kernel/*.deb
            out/uki/*.EFI
            out/uki/*.efi
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # vm-tests — the QEMU proofs. Opt-in, because a full run with no KVM is slow.
  # ---------------------------------------------------------------------------
  vm-tests:
    name: qemu tests
    runs-on: [self-hosted, linux, x64]
    needs: [iso, image]
    if: github.event_name == 'workflow_dispatch' && inputs.run_vm_tests
    permissions:
      contents: read
      packages: read
    container:
      # The test stage is the build stage plus QEMU, OVMF and expect.
      image: ghcr.io/${{ github.repository }}/test:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --cap-add SYS_ADMIN
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: restore kernel artifacts
        uses: actions/cache@v4
        with:
          path: out/kernel
          key: kernel-${{ hashFiles('ubuntu_uki_iso/kernel/config.py') }}

      - name: download the ISO
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-uki-iso
          path: out

      - name: run
        run: python3 -m ubuntu_uki_iso.cli test vm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-test-logs
          path: out/vm-logs/
          if-no-files-found: ignore
